<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <title>Hermes</title>
    <style>
        html, body { margin: 0; padding: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--tg-theme-bg-color, #1a1a2e); color: var(--tg-theme-text-color, #e0e0e0); }
        * { box-sizing: border-box; }
        body { padding: 14px; display: flex; flex-direction: column; }
        .hdr { text-align: center; padding: 6px 0 14px; }
        .hdr h1 { font-size: 20px; font-weight: 700; margin: 0; }
        .hdr p { font-size: 12px; color: var(--tg-theme-hint-color, #8e8e93); margin: 2px 0 0; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; flex: 1; align-content: start; }
        .card { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 18px 10px; min-height: 80px; border-radius: 14px; border: none; background: color-mix(in srgb, var(--tg-theme-secondary-bg-color, #232336) 60%, transparent); color: var(--tg-theme-text-color, #e0e0e0); cursor: pointer; font-family: inherit; font-size: 13px; }
        .card .emoji { font-size: 28px; }
        .card .lbl  { font-size: 11px; font-weight: 600; text-align: center; }
        .card:active { transform: scale(0.95); opacity: 0.8; }
    </style>
</head>
<body>
    <div class="hdr"><h1>⚡ Hermes</h1><p>Быстрый доступ</p></div>
    <div class="grid">
        <button class="card" onclick="openLink('https://app.plane.so')">
            <span class="emoji">📋</span><span class="lbl">Plane</span></button>
        <button class="card" onclick="openLink('https://outline.polynkovsk.ru')">
            <span class="emoji">📖</span><span class="lbl">Outline</span></button>
        <button class="card" onclick="openLink('https://kaneo.polynkovsk.ru')">
            <span class="emoji">📝</span><span class="lbl">Канбан</span></button>
        <button class="card" onclick="openLink('http://109.120.155.82:8090')">
            <span class="emoji">🖥</span><span class="lbl">Инфра КБ</span></button>
        <button class="card" onclick="openLink('https://appflowy.polynkovsk.ru')">
            <span class="emoji">📄</span><span class="lbl">AppFlowy</span></button>
        <button class="card" onclick="openLink('https://hermes.polynkovsk.ru')">
            <span class="emoji">🤖</span><span class="lbl">Hermes</span></button>
        <button class="card" onclick="openLink('https://proxy.polynkovsk.ru')">
            <span class="emoji">🔄</span><span class="lbl">Proxy</span></button>
        <button class="card" onclick="openLink('http://109.120.155.82:8099')">
            <span class="emoji">⚙️</span><span class="lbl">Executor</span></button>
    </div>
    <script>
        var tg = window.Telegram.WebApp;
        if (tg) { try { tg.expand(); tg.ready(); } catch(e){} }
        function openLink(url) {
            if (tg && tg.openLink) tg.openLink(url);
            else window.open(url, '_blank');
        }
    </script>
</body>
</html>
