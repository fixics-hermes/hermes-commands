<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <title>Hermes</title>
    <style>
        html, body { margin: 0; padding: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--tg-theme-bg-color, #1a1a2e); color: var(--tg-theme-text-color, #e0e0e0); }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        /* --- Main screen --- */
        #main { padding: 12px; min-height: 100%; display: flex; flex-direction: column; }
        #content { display: none; position: absolute; inset: 0; background: var(--tg-theme-bg-color, #1a1a2e); z-index: 10; flex-direction: column; }

        .hdr { text-align: center; padding: 8px 0 12px; flex-shrink: 0; }
        .hdr h1 { font-size: 20px; font-weight: 700; margin: 0; }
        .hdr p { font-size: 12px; color: var(--tg-theme-hint-color, #8e8e93); margin: 2px 0 0; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .card { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 18px 10px; min-height: 80px; border-radius: 14px; border: none; background: color-mix(in srgb, var(--tg-theme-secondary-bg-color, #232336) 60%, transparent); color: var(--tg-theme-text-color, #e0e0e0); cursor: pointer; font-family: inherit; font-size: 13px; }
        .card .emoji { font-size: 28px; line-height: 1; }
        .card .lbl  { font-size: 11px; font-weight: 600; text-align: center; line-height: 1.3; }
        .card:active { transform: scale(0.94); }

        /* --- Content screen --- */
        #cbar { display: flex; align-items: center; padding: 10px 12px; background: var(--tg-theme-secondary-bg-color, #232336); min-height: 44px; flex-shrink: 0; }
        #back  { background: none; border: none; color: var(--tg-theme-button-color, #2b7cff); font-size: 15px; font-weight: 500; cursor: pointer; }
        #ctitle { flex: 1; font-size: 14px; font-weight: 600; margin-left: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        #cbody { flex: 1; overflow: hidden; }

        .result { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 30px 20px; text-align: center; height: 100%; }
        .result .emoji { font-size: 44px; }
        .result .cmd   { font-size: 15px; font-weight: 600; padding: 12px 18px; background: var(--tg-theme-secondary-bg-color, #232336); border-radius: 12px; }
        .result .hint  { font-size: 12px; color: var(--tg-theme-hint-color, #8e8e93); }
        .btn { display: inline-block; padding: 12px 24px; border-radius: 12px; font-size: 14px; font-weight: 600; cursor: pointer; border: none; background: var(--tg-theme-button-color, #2b7cff); color: var(--tg-theme-button-text-color, #fff); }
        .btn-outline { background: transparent; border: 1px solid var(--tg-theme-button-color, #2b7cff); color: var(--tg-theme-button-color, #2b7cff); }

        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--tg-theme-button-color, #2b7cff); color: var(--tg-theme-button-text-color, #fff); padding: 10px 20px; border-radius: 12px; font-size: 13px; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 99; }
        .toast.on { opacity: 1; }
    </style>
</head>
<body>

<div id="main">
    <div class="hdr"><h1>⚡ Hermes</h1><p>Быстрый доступ</p></div>
    <div class="grid">
        <button class="card" data-em="📧" data-lb="Почта" data-cmd="📧 Проверить почту">
            <span class="emoji">📧</span><span class="lbl">Почта</span></button>
        <button class="card" data-em="📋" data-lb="Plane" data-url="https://app.plane.so">
            <span class="emoji">📋</span><span class="lbl">Plane</span></button>
        <button class="card" data-em="📊" data-lb="Zabbix" data-cmd="📊 Статус Zabbix">
            <span class="emoji">📊</span><span class="lbl">Zabbix</span></button>
        <button class="card" data-em="🖥" data-lb="Инфра" data-url="http://109.120.155.82:8090/">
            <span class="emoji">🖥</span><span class="lbl">Инфра</span></button>
        <button class="card" data-em="📝" data-lb="Канбан" data-url="https://kaneo.polynkovsk.ru">
            <span class="emoji">📝</span><span class="lbl">Канбан</span></button>
        <button class="card" data-em="📖" data-lb="Outline" data-url="https://outline.polynkovsk.ru">
            <span class="emoji">📖</span><span class="lbl">Outline</span></button>
        <button class="card" data-em="🔄" data-lb="Системы" data-cmd="🔄 Статус систем">
            <span class="emoji">🔄</span><span class="lbl">Системы</span></button>
        <button class="card" data-em="📜" data-lb="Логи" data-cmd="📜 Логи гейта">
            <span class="emoji">📜</span><span class="lbl">Логи</span></button>
    </div>
</div>

<div id="content">
    <div id="cbar"><button id="back">← Главная</button><span id="ctitle"></span></div>
    <div id="cbody"></div>
</div>

<div class="toast" id="toast"></div>

<script>
// IIFE — изолированный scope
!(function(){
    var tg = window.Telegram.WebApp;
    if (tg && tg.expand) { try { tg.expand() } catch(e){} }
    if (tg && tg.ready)  { try { tg.ready()  } catch(e){} }

    var mainEl = document.getElementById('main');
    var cntEl  = document.getElementById('content');
    var titleEl= document.getElementById('ctitle');
    var bodyEl = document.getElementById('cbody');
    var toastEl= document.getElementById('toast');

    var toastTimer;
    function toast(msg) {
        toastEl.textContent = msg; toastEl.classList.add('on');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function(){ toastEl.classList.remove('on'); }, 2000);
    }

    // Back
    document.getElementById('back').onclick = function() {
        cntEl.style.display = 'none';
        mainEl.style.display = '';
    };

    // Click handler
    function onCard(btn) {
        var cmd = btn.getAttribute('data-cmd') || '';
        var url = btn.getAttribute('data-url') || '';
        var em  = btn.getAttribute('data-em') || '';
        var lb  = btn.getAttribute('data-lb') || '';

        titleEl.textContent = em + ' ' + lb;
        mainEl.style.display = 'none';
        cntEl.style.display = 'flex';

        if (url) {
            // Open external link
            bodyEl.innerHTML =
                '<div class="result">' +
                '<div class="emoji">' + em + '</div>' +
                '<div class="hint">' + lb + '</div>' +
                '<button class="btn" onclick="window.Telegram.WebApp.openLink(\'' + url + '\')">↗ Открыть</button>' +
                '</div>';
        } else if (cmd) {
            // Hermes command — copy
            bodyEl.innerHTML =
                '<div class="result">' +
                '<div class="emoji">' + em + '</div>' +
                '<div class="cmd">' + cmd + '</div>' +
                '<div class="hint">Скопировано. Вставь в чат и отправь.</div>' +
                '</div>';
            try { navigator.clipboard.writeText(cmd); } catch(e) {}
            // Also try sendData
            try { if (tg && tg.sendData) tg.sendData(JSON.stringify({text: cmd})); } catch(e) {}
            toast('✓ ' + cmd);
        }
    }

    // Bind cards
    var cards = document.querySelectorAll('.card');
    for (var i = 0; i < cards.length; i++) {
        cards[i].onclick = (function(c){ return function(){ onCard(c); }; })(cards[i]);
    }
})();
</script>
</body>
</html>
