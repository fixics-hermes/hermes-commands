<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <title>Hermes</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--tg-theme-bg-color, #1a1a2e); color: var(--tg-theme-text-color, #e0e0e0); padding: 16px; min-height: 100vh; }
        .header { text-align: center; padding: 16px 0 20px; }
        .header h1 { font-size: 22px; font-weight: 700; }
        .header p { font-size: 13px; color: var(--tg-theme-hint-color, #8e8e93); margin-top: 4px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
        .cmd-btn { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 18px 10px; border: none; border-radius: 14px; background: color-mix(in srgb, var(--tg-theme-secondary-bg-color, #232336) 60%, transparent); color: var(--tg-theme-text-color, #e0e0e0); font-size: 14px; font-weight: 500; cursor: pointer; min-height: 90px; }
        .cmd-btn .icon { font-size: 28px; }
        .cmd-btn .label { font-size: 12px; font-weight: 600; text-align: center; }
        .cmd-btn:active { transform: scale(0.95); opacity: 0.8; }
        .section-title { font-size: 14px; font-weight: 600; color: var(--tg-theme-hint-color, #8e8e93); margin-bottom: 10px; }
        .custom-row { display: flex; gap: 10px; }
        .custom-row input { flex: 1; padding: 14px 16px; border: none; border-radius: 12px; background: color-mix(in srgb, var(--tg-theme-secondary-bg-color, #232336) 60%, transparent); color: var(--tg-theme-text-color, #e0e0e0); font-size: 15px; outline: none; }
        .send-btn { padding: 14px 20px; border: none; border-radius: 12px; background: var(--tg-theme-button-color, #2b7cff); color: var(--tg-theme-button-text-color, #ffffff); font-size: 18px; font-weight: 600; cursor: pointer; min-width: 54px; }
        .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px); background: var(--tg-theme-button-color, #2b7cff); color: var(--tg-theme-button-text-color, #ffffff); padding: 12px 24px; border-radius: 12px; font-size: 14px; opacity: 0; transition: transform 0.35s, opacity 0.3s; pointer-events: none; }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    </style>
</head>
<body>
    <div class="header"><h1>⚡ Hermes</h1><p>Просто нажми — текст скопируется</p></div>
    <div class="grid">
        <button class="cmd-btn" onclick="run('📧 Проверить почту')"><span class="icon">📧</span><span class="label">Проверить почту</span></button>
        <button class="cmd-btn" onclick="run('📋 Брифы в Plane')"><span class="icon">📋</span><span class="label">Брифы в Plane</span></button>
        <button class="cmd-btn" onclick="run('📊 Статус Zabbix')"><span class="icon">📊</span><span class="label">Статус Zabbix</span></button>
        <button class="cmd-btn" onclick="run('🖥 Инфраструктура')"><span class="icon">🖥</span><span class="label">Инфраструктура</span></button>
        <button class="cmd-btn" onclick="run('📝 Записать в КБ')"><span class="icon">📝</span><span class="label">Записать в КБ</span></button>
        <button class="cmd-btn" onclick="run('🔍 Поиск в памяти')"><span class="icon">🔍</span><span class="label">Поиск в памяти</span></button>
        <button class="cmd-btn" onclick="run('🔄 Статус систем')"><span class="icon">🔄</span><span class="label">Статус систем</span></button>
        <button class="cmd-btn" onclick="run('📜 Логи гейта')"><span class="icon">📜</span><span class="label">Логи гейта</span></button>
    </div>
    <div class="toast" id="toast"></div>
    <script>
        var tg = window.Telegram.WebApp;
        var webview = window.Telegram.WebView;

        var info = 'v=' + (tg.version || '?')
            + ' plat=' + (tg.platform || '?')
            + ' wv=' + (typeof webview);

        tg.ready();
        tg.expand();
        tg.disableVerticalSwipes();
        tg.MainButton.hide();

        var toast = document.getElementById('toast');

        function show(text) {
            toast.textContent = text;
            toast.classList.add('show');
            setTimeout(function(){ toast.classList.remove('show'); }, 3000);
        }

        show(info);

        // Try to close on click via back button
        if (tg.BackButton) {
            tg.BackButton.show();
            tg.BackButton.onClick(function() {
                tg.close();
            });
        }

        function run(cmd) {
            // Copy to clipboard
            try { navigator.clipboard.writeText(cmd); } catch(e) {}

            // Try sendData (best effort)
            try {
                var payload = JSON.stringify({command: 'cmd', text: cmd});
                if (tg.sendData) tg.sendData(payload);
            } catch(e) {}

            show('↵ Скопировано. Вставь в чат: ' + cmd);

            // Close
            setTimeout(function() {
                try { tg.close(); } catch(e) {}
            }, 300);
        }
    </script>
</body>
</html>
